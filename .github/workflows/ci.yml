# Typecheck, lint, unit tests and production builds on every push and pull request.
# No secrets and no database: PostgreSQL tests (npm run test:db) run only where TEST_DATABASE_URL
# points at an isolated Neon test branch, never in this workflow and never against production.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
